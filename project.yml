name: Simplify

options:
  bundleIdPrefix: dev.yoom
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  SimplifyKit:
    path: Packages/SimplifyKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    # Personal Team (Xcode › Settings › Accounts)
    DEVELOPMENT_TEAM: RCKK92UBYM
    ENABLE_HARDENED_RUNTIME: YES
    # One App Group for app and widgets; SimplifyKit.AppGroup reads it from Info.plist.
    APP_GROUP_ID: $(TeamIdentifierPrefix)dev.yoom.simplify

targets:
  Simplify:
    type: application
    platform: macOS
    sources: [Apps/macOS]
    # GOOGLE_CLIENT_ID comes from Config/Secrets.xcconfig (git-ignored) through Base.xcconfig.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: SimplifyKit
      - target: SimplifyWidgets
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: Simplify
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        SimplifyAppGroup: $(APP_GROUP_ID)
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        NSRemindersFullAccessUsageDescription: 마감일이 있는 미리알림을 달력에 보여 주려고 해요.
        NSAppleEventsUsageDescription: Simplify에 쓴 메모를 메모 앱의 Simplify 폴더에도 같은 내용으로 써 두려고 해요.
        # simplify://day/yyyy-MM-dd opens that day; the widgets link to it.
        CFBundleURLTypes:
          - CFBundleURLName: dev.yoom.simplify.day
            CFBundleURLSchemes: [simplify]
    entitlements:
      path: Apps/macOS/Simplify.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # EventKit (the Mac's reminders) inside the sandbox and the hardened runtime.
        com.apple.security.personal-information.calendars: true
        # 설정 › 일반 › Apple 메모에도 쓰기: AppleScript to the 메모 app only.
        com.apple.security.automation.apple-events: true
        com.apple.security.temporary-exception.apple-events:
          - com.apple.Notes
        # 설정 › 일반 › iCloud Drive로 기기끼리 맞추기: the folder picked there, kept across launches.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yoom.simplify
        # Apps/macOS/AppIcon.icon (Icon Composer), made by design/icon/make-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SimplifyWidgets:
    type: app-extension
    platform: macOS
    sources: [Widgets]
    dependencies:
      - package: SimplifyKit
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Simplify
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SimplifyAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/SimplifyWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yoom.simplify.widgets

schemes:
  Simplify:
    build:
      targets:
        Simplify: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: SimplifyKit/SimplifyKitTests
